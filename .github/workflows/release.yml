name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    # 👇 ЭТОТ БЛОК РЕШАЕТ ПРОБЛЕМУ 403 (Forbidden)
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Accept licenses
        run: yes | sdkmanager --licenses || true
      
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Build Release APK
        run: ./gradlew assembleRelease
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          # 👇 МАСКИ *.apk НАЙДУТ ФАЙЛ, ДАЖЕ ЕСЛИ ИМЯ НЕМНОГО ОТЛИЧАЕТСЯ
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          body: |
            ## 📦 Что нового в версии ${{ github.ref_name }}:
            
            ### Обновления:
            - Добавлен Модуль 2 (Исключения, I/O, Коллекции)
            - Обновлен Gradle до 7.5 и Android Gradle Plugin до 7.4.2
            - Обновлен targetSdkVersion до 33
            
            ---
            *Автоматический релиз создан GitHub Actions*
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}